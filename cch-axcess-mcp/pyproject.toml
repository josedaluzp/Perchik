[project]
name = "cch-axcess-mcp"
version = "0.1.0"
description = "MCP server (stdio) para leer/escribir returns en CCH Axcess via Tax Services v2 (OIP)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cch-axcess-mcp = "cch_axcess_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cch_axcess_mcp"]
